<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<title>Documents</title>
<style>
  :root{--bg:#111;--panel:#1b1d22;--line:#2c2f36;--muted:#9aa0aa;--accent:#4a90e2}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:#ddd;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column}
  header{display:flex;gap:12px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  header a{color:var(--accent);text-decoration:none}
  header b{font-size:15px}
  #files{display:flex;gap:6px;flex-wrap:wrap}
  #files button{background:#0b0c0e;color:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
  #files button.on{border-color:var(--accent);background:#17324d}
  main{flex:1;min-height:0;display:flex}
  iframe,main img{flex:1;border:0;width:100%;height:100%;background:#fff;object-fit:contain}
  main img{background:#000}
  #msg{margin:auto;color:var(--muted);padding:20px;text-align:center}
  #msg a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <a href="./#docs">&#8592; Records</a>
  <b id="title">Documents</b>
  <div id="files"></div>
  <a id="open" href="#" target="_blank" rel="noopener" hidden>Open in new tab</a>
</header>
<main><div id="msg">Loading…</div></main>
<script>
const $ = s => document.querySelector(s);
const id = new URLSearchParams(location.search).get("s") || "";
const url = p => "files/" + [id].concat(p.split("/")).map(encodeURIComponent).join("/");
const isImg = p => /\.(jpe?g|png|gif|webp|bmp)$/i.test(p);
function show(p, btn) {
  document.querySelectorAll("#files button").forEach(b => b.classList.toggle("on", b === btn));
  const main = document.querySelector("main"); main.innerHTML = "";
  const u = url(p);
  if (isImg(p)) { const i = document.createElement("img"); i.src = u; i.alt = p; main.appendChild(i); }
  else if (/\.(pdf|txt)$/i.test(p)) { const f = document.createElement("iframe"); f.src = u; f.title = p; main.appendChild(f); }
  else main.innerHTML = '<div id="msg">This file type can\'t be shown in the browser. <a href="' + u + '" download>Download it</a>.</div>';
  $("#open").href = u; $("#open").hidden = false;
}
(async () => {
  try {
    const [lib, list] = await Promise.all([
      fetch("api/library", { cache: "no-store" }).then(r => r.json()),
      fetch(url("files.json"), { cache: "no-store" }).then(r => {
        if (r.status === 404 && !new URLSearchParams(location.search).has("noimport")) { location.replace("import.html?s=" + encodeURIComponent(id)); return new Promise(() => {}); } // first visit: copy from Google Drive
        if (!r.ok) throw new Error("not found"); return r.json(); }),
    ]);
    const e = lib.find(x => x.id === id);
    if (e) { $("#title").textContent = e.title + (e.date ? " · " + e.date : ""); document.title = e.title; }
    list.forEach((p, i) => {
      const b = document.createElement("button");
      b.textContent = p.split("/").pop(); b.onclick = () => show(p, b);
      $("#files").appendChild(b);
      if (i === 0) show(p, b);
    });
    if (!list.length) $("#msg").textContent = "No files.";
  } catch (err) { $("#msg").textContent = "Could not open these documents (" + err.message + ")."; }
})();
</script>
</body>
</html>
