<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<title>Upload</title>
<style>
  :root{--panel:#1b1d22;--line:#2c2f36;--muted:#9aa0aa;--accent:#4a90e2;--bad:#ff8a80}
  body{margin:0;background:#111;color:#ddd;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center;padding:16px}
  .card{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;box-sizing:border-box}
  h1{font-size:20px;margin:0 0 12px}
  label{display:block;margin:12px 0 4px;color:var(--muted);font-size:13px}
  input,select{width:100%;box-sizing:border-box;background:#0b0c0e;color:inherit;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit}
  .pick{display:flex;gap:8px;flex-wrap:wrap}
  button{background:#23262d;color:inherit;border:1px solid var(--line);border-radius:8px;padding:10px 14px;font:inherit;cursor:pointer}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  button:disabled{opacity:.5;cursor:default}
  #chosen,.note{font-size:13px;color:var(--muted);margin-top:8px}
  #bar{height:8px;background:#2c2f36;border-radius:4px;overflow:hidden;margin:14px 0 6px}
  #bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  #err{color:var(--bad);white-space:pre-wrap;font-size:13px;max-height:30vh;overflow:auto}
  a{color:var(--accent)}
</style>
</head>
<body>
<div class="card">
  <h1>Upload scans or documents</h1>
  <label for="type">Type</label>
  <select id="type">
    <option value="mri">MRI</option><option value="ct">CT</option><option value="xray">X-ray</option><option value="docs">Documents (PDF, photos)</option>
  </select>
  <label for="title">Title</label>
  <input id="title" placeholder="e.g. CT head + angio">
  <label for="date">Date of the scan / document</label>
  <input id="date" type="date">
  <label>Files</label>
  <div class="pick">
    <button id="folderBtn" type="button">Choose a folder</button>
    <button id="filesBtn" type="button">Choose files</button>
  </div>
  <input id="folderIn" type="file" webkitdirectory multiple hidden>
  <input id="filesIn" type="file" multiple hidden>
  <div id="chosen">For a CD copy, choose the whole folder: only DICOM image files are kept (DICOMDIR, programs and viewer files are skipped).</div>
  <div style="margin-top:16px"><button id="go" class="on" disabled>Upload</button></div>
  <div id="bar"><i></i></div>
  <div id="status" class="note"></div>
  <div id="err"></div>
  <p class="note"><a href="./">&#8592; Back to records</a></p>
</div>
<script>
const $ = s => document.querySelector(s);
const SKIP_FOLDERS = ["jre", "lib"], SKIP_EXT = ["exe", "jar", "xml", "dll", "ini", "inf", "bat", "cmd", "sh", "properties", "ico", "gif", "htm", "html", "css", "js", "txt", "pdf"];
const DOC_EXT = ["pdf", "jpg", "jpeg", "png", "gif", "webp", "txt", "doc", "docx"];
let picked = [], curId = null;
function ext(n) { const m = /\.([^.\/]+)$/.exec(n || ""); if (!m) return ""; const e = m[1].toLowerCase(); return /^\d+$/.test(e) ? "" : e; }
function relPath(f) { return (f.webkitRelativePath || f.name).replace(/\\/g, "/"); }
function keep(f) {
  const path = relPath(f), parts = path.split("/"), name = parts[parts.length - 1], e = ext(name);
  if ($("#type").value === "docs") return DOC_EXT.includes(e);
  if (parts.slice(0, -1).some(d => SKIP_FOLDERS.includes(d.trim().toLowerCase()))) return false;
  if (name.toUpperCase() === "DICOMDIR" || name.startsWith(".")) return false;
  if (["dcm", "dicom", "ima"].includes(e)) return true;
  return !e && !SKIP_EXT.includes(e);
}
function refresh() {
  const files = picked.filter(keep);
  const mb = files.reduce((a, f) => a + f.size, 0) / 1048576;
  $("#chosen").textContent = picked.length ? files.length + " of " + picked.length + " files will be uploaded (" + mb.toFixed(1) + " MB)." : "No files chosen.";
  $("#go").disabled = !files.length;
}
function choose(input) { input.onchange = () => { picked = Array.from(input.files); curId = null; if (!$("#title").value && picked[0]) $("#title").value = relPath(picked[0]).split("/")[0]; refresh(); }; input.click(); }
$("#folderBtn").onclick = () => choose($("#folderIn"));
$("#filesBtn").onclick = () => choose($("#filesIn"));
$("#type").onchange = refresh;
$("#date").valueAsDate = new Date();
{ const t = new URLSearchParams(location.search).get("type"); if (t && [...$("#type").options].some(o => o.value === t)) $("#type").value = t; }

function strip(path) { // drop the chosen folder's own name so paths start inside it
  const p = path.split("/"); return (p.length > 1 && picked.some(f => f.webkitRelativePath) ? p.slice(1) : p)
    .map(x => x.replace(/[^\w.\- ]+/g, "_").trim() || "_").join("/");
}
async function put(id, f, path) {
  for (let a = 0; ; a++) {
    try {
      const r = await fetch("api/upload?s=" + id + "&path=" + encodeURIComponent(path), { method: "PUT", body: f, headers: { "Content-Type": f.type || (ext(f.name) ? "application/octet-stream" : "application/dicom") } });
      if (r.ok) return;
      if (a >= 3) throw new Error("HTTP " + r.status);
    } catch (e) { if (a >= 3) throw e; }
    await new Promise(r => setTimeout(r, 1500 * 2 ** a));
  }
}
$("#go").onclick = async () => {
  const type = $("#type").value, files = picked.filter(keep);
  const id = curId = curId || type + "-" + ($("#date").value || "").replace(/-/g, "") + "-" + Math.random().toString(36).slice(2, 7);
  const paths = files.map(f => strip(relPath(f)));
  if (new Set(paths).size !== paths.length) { $("#err").textContent = "Two files would get the same name; choose them as a folder instead."; return; }
  $("#go").disabled = true; $("#err").textContent = "";
  let done = 0, next = 0; const errors = [];
  const show = () => { $("#status").textContent = "Uploading " + done + " / " + files.length; $("#bar i").style.width = (done / files.length * 100) + "%"; };
  show();
  const worker = async () => { while (next < files.length) { const i = next++; try { await put(id, files[i], paths[i]); } catch (e) { errors.push(paths[i] + ": " + e.message); } done++; show(); } };
  await Promise.all([worker(), worker(), worker(), worker()]);
  if (errors.length) { $("#err").textContent = errors.length + " file(s) failed – press Upload to try again:\n" + errors.join("\n"); $("#go").disabled = false; return; }
  const r = await fetch("api/upload?s=" + id + "&finish=1", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ type, title: $("#title").value.trim() || id, date: $("#date").value, files: paths }) });
  if (!r.ok) { $("#err").textContent = "Could not finish: " + await r.text(); $("#go").disabled = false; return; }
  $("#status").innerHTML = "Done. <a href='" + (type === "docs" ? "docs.html?s=" : "./?s=") + id + "'>Open it</a> or <a href='./#" + type + "'>go back to records</a>.";
};
</script>
</body>
</html>
