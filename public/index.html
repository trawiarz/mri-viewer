<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#000000">
<title>MRI Viewer</title>
<style>
:root{
  --bg:#0d0e10;--panel:#16181c;--panel2:#1e2127;--line:#2a2e36;--text:#e6e8eb;--muted:#9aa1ab;
  --accent:#4ea1ff;--accent-bg:#1b3350;--bad:#ff6b6b;--ok:#5fd38d;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{overflow:hidden}
button,input{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;white-space:nowrap;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:hover{border-color:#3b414c}
button.on{background:var(--accent-bg);border-color:var(--accent);color:#fff}
button:disabled{opacity:.45;cursor:default}
.hidden{display:none!important}

/* ---------- setup ---------- */
#setup{height:100%;overflow:auto;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.card h1{font-size:20px;margin:0 0 6px}
.card p{margin:0 0 14px;color:var(--muted)}
.card input{width:100%;background:#0b0c0e;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.card input:focus{outline:none;border-color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button{flex:1 1 auto}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.cats button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:16px;border-radius:12px;font-size:15px;text-align:left}
.cats button b{font-size:19px}.cats button span{font-size:12.5px;color:var(--muted)}
.cats button.on{border-color:var(--accent);background:#17324d}
.cats button.empty{opacity:.55}
#catTitle{font-size:15px;margin:6px 0 8px}
#studyList a{display:block;padding:11px 12px;margin-bottom:8px;border:1px solid var(--line);border-radius:10px;background:#0b0c0e;color:inherit;text-decoration:none}
#studyList a:hover{border-color:var(--accent)}
#studyList small{display:block;color:var(--muted);margin-top:2px}
.note a{color:var(--accent)}
#genOut{margin-top:14px;word-break:break-all;background:#0b0c0e;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
#genOut a{color:var(--accent)}
.err{color:var(--bad);margin-top:8px;min-height:1em}
.note{font-size:12.5px;color:var(--muted);margin-top:14px}

/* ---------- app ---------- */
#app{height:100%;height:100dvh;display:grid;
  grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto auto;
  grid-template-areas:"top" "series" "stage" "slider" "tools"}
#homeBtn{color:var(--accent);text-decoration:none;white-space:nowrap;font-size:13px}
#presetSel{background:var(--panel2);color:inherit;border:1px solid var(--line);border-radius:8px;padding:6px}
#top{grid-area:top;display:flex;align-items:center;gap:8px;padding:6px 10px;padding-top:max(6px,env(safe-area-inset-top));
  background:var(--panel);border-bottom:1px solid var(--line);min-height:40px}
#status{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:13px}
#loadBox{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:5;width:min(420px,calc(100% - 32px));box-sizing:border-box;background:rgba(20,22,27,.92);border:1px solid var(--accent);border-radius:12px;padding:12px 16px;text-align:center;pointer-events:none;box-shadow:0 4px 18px rgba(0,0,0,.5)}
#loadBox b{display:block;font-size:18px;color:#fff;margin-bottom:8px}
#loadBox small{display:block;color:#9aa0aa;font-size:12px;margin-top:6px}
#loadBar{height:10px;background:#2c2f36;border-radius:5px;overflow:hidden}
#loadBar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#loadBox.done{display:none}
#bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;width:80px;flex:none}
#bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#failBtn{padding:4px 9px;font-size:12.5px;color:var(--bad);border-color:#5a2a2a}
#series{grid-area:series;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:6px;background:var(--panel);
  border-bottom:1px solid var(--line);scrollbar-width:thin}
.th{flex:none;width:76px;background:#000;border:2px solid transparent;border-radius:8px;overflow:hidden;cursor:pointer;padding:0;text-align:left}
.th.on{border-color:var(--accent)}
.th canvas{display:block;width:100%;aspect-ratio:1;background:#000}
.th .lb{display:block;font-size:11px;line-height:1.25;padding:3px 4px;background:var(--panel2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.th .ct{color:var(--muted)}
#stage{grid-area:stage;position:relative;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;pointer-events:none;font-size:12px;line-height:1.35;color:#fff;text-shadow:0 0 3px #000,0 0 2px #000;
  padding:6px 8px;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov div{overflow:hidden;text-overflow:ellipsis}
.ovd{font-size:15px;font-weight:700}
.pan{position:absolute;top:0;bottom:0;left:0;width:100%;pointer-events:none}
#pan1{display:none}
#stage.dual #pan0{width:50%}#stage.dual #pan1{display:block;left:50%;width:50%}
.pan .t{top:2px;left:50%;transform:translateX(-50%)}.pan .b{bottom:2px;left:50%;transform:translateX(-50%)}.pan .l{left:4px;top:50%;transform:translateY(-50%)}.pan .r{right:4px;top:50%;transform:translateY(-50%)}
.pan .tl{top:0;left:0}.pan .tr{top:0;right:0;text-align:right}.pan .bl{bottom:0;left:0}.pan .br{bottom:0;right:0;text-align:right}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
#msg .box{max-width:460px;background:rgba(22,24,28,.95);border:1px solid var(--line);border-radius:12px;padding:18px}
#msg h2{margin:0 0 8px;font-size:17px}
#msg p{margin:0 0 12px;color:var(--muted)}
#msg.error h2{color:var(--bad)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:0 auto 12px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#sliderWrap{grid-area:slider;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-top:1px solid var(--line)}
#slider{flex:1;accent-color:var(--accent);height:24px;margin:0}
#sliderLbl{font-size:12px;color:var(--muted);min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
#tools{grid-area:tools;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:6px 8px;padding-bottom:max(6px,env(safe-area-inset-bottom));background:var(--panel);
  align-items:center}
@media (max-width:799px){#tools button{padding:6px 9px;font-size:13px}#tools .sep{display:none}}
.seg{display:flex;flex:none}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:8px 0 0 8px;margin-left:0}
.seg button:last-child{border-radius:0 8px 8px 0}
.sep{flex:none;width:1px;align-self:stretch;background:var(--line);margin:2px 2px}
#tools>button{flex:none}

/* failures + grid overlays */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet .inner{background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 0 0;width:100%;max-width:640px;max-height:75vh;display:flex;flex-direction:column}
.sheet header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.sheet header b{flex:1}
.sheet .body{overflow:auto;padding:8px 12px 16px}
#failList div{padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;word-break:break-all}
#failList span{color:var(--muted)}
#grid{position:fixed;inset:0;z-index:15;background:#000;display:flex;flex-direction:column}
#grid header{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
#grid header b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#gridBody{flex:1;overflow:auto;padding:6px;padding-bottom:max(6px,env(safe-area-inset-bottom))}
.gh{font-size:13px;color:var(--muted);padding:10px 2px 6px}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:4px}
.gi{position:relative;background:#000;border:2px solid transparent;border-radius:4px;padding:0;overflow:hidden;aspect-ratio:1;cursor:pointer}
.gi.on{border-color:var(--accent)}
.gi canvas{width:100%;height:100%;display:block}
.gi span{position:absolute;left:3px;bottom:2px;font-size:10.5px;color:#fff;text-shadow:0 0 3px #000}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;color:#000;border-radius:20px;padding:8px 16px;
  z-index:30;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}

@media (min-width:800px){
  #tools{justify-content:flex-start}
  #app{grid-template-columns:200px 1fr;grid-template-rows:auto 1fr auto auto;
    grid-template-areas:"top top" "series stage" "series slider" "series tools"}
  #series{flex-direction:column;overflow-y:auto;overflow-x:hidden;border-bottom:0;border-right:1px solid var(--line);padding:8px}
  .th{width:100%;display:flex;align-items:center;background:var(--panel2)}
  .th canvas{width:64px;flex:none}
  .th .lb{flex:1;min-width:0;font-size:12px;white-space:normal;max-height:4.2em;background:none;padding:4px 6px}
  .ov{font-size:13px}
  .gg{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .sheet{align-items:center}
  .sheet .inner{border-radius:14px}
}
</style>
<!-- daikon's bundle only initialises when a global `require` exists. Keep this defined. -->
<script>window.require=function(n){throw new Error("no module "+n)}</script>
<script src="https://cdn.jsdelivr.net/npm/daikon@1.2.46/release/current/daikon.js"></script>
</head>
<body>

<div id="setup" class="hidden">
  <div class="card home">
    <h1>Medical records</h1>
    <div class="cats" id="cats">
      <button data-type="mri"><b>MRI</b><span></span></button>
      <button data-type="ct"><b>CT</b><span></span></button>
      <button data-type="xray"><b>X-ray</b><span></span></button>
      <button data-type="docs"><b>Documents</b><span></span></button>
    </div>
    <h2 id="catTitle"></h2>
    <div id="studyList"></div>
    <div class="err" id="setupErr"></div>
  </div>
</div>

<div id="app" class="hidden">
  <div id="top">
    <a id="homeBtn" href="./" title="All records">&#8592; Records</a>
    <div id="status">Starting…</div>
    <div id="bar"><i></i></div>
    <button id="failBtn" class="hidden"></button>
  </div>
  <div id="series"></div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="loadBox"><b id="loadTxt">Loading images…</b><div id="loadBar"><i></i></div><small>Please wait – images appear as they arrive</small></div>
    <div class="pan" id="pan0"><div class="ov tl"></div><div class="ov tr"></div><div class="ov bl"></div><div class="ov br"></div><div class="ov ovd t"></div><div class="ov ovd b"></div><div class="ov ovd l"></div><div class="ov ovd r"></div></div>
    <div class="pan" id="pan1"><div class="ov tl"></div><div class="ov tr"></div><div class="ov bl"></div><div class="ov br"></div><div class="ov ovd t"></div><div class="ov ovd b"></div><div class="ov ovd l"></div><div class="ov ovd r"></div></div>
    <div id="msg"></div>
  </div>
  <div id="sliderWrap">
    <input id="slider" type="range" min="0" max="0" value="0" step="1" aria-label="Image">
    <span id="sliderLbl">0 / 0</span>
  </div>
  <div id="tools">
    <div class="seg" id="toolSeg">
      <button data-tool="scroll" class="on" title="Drag to scroll through images">Scroll</button>
      <button data-tool="contrast" title="Drag to change contrast (also right-drag)">Contrast</button>
      <button data-tool="move" title="Drag to move the image">Move</button>
      <button data-tool="zoom" title="Drag up/down to zoom">Zoom</button>
    </div>
    <span class="sep"></span>
    <button id="playBtn" title="Play / pause (Space)">Play</button>
    <button id="invBtn" title="Invert (I)">Invert</button>
    <button id="resetBtn" title="Reset view and contrast (R, double-click)">Reset</button>
    <select id="presetSel" hidden title="CT window presets">
      <option value="">Window…</option><option value="40,80">Brain</option><option value="50,400">Soft tissue</option>
      <option value="-600,1500">Lung</option><option value="400,1800">Bone</option><option value="200,600">Angio</option><option value="75,215">Stroke</option>
    </select>
    <button id="dualBtn" title="Two panels: this image and the next one (2)">2 panels</button>
    <button id="gridBtn" title="All images (G)">All images</button>
    <button id="shareBtn" title="Share link to this viewer">Share link</button>
  </div>
</div>

<div id="grid" class="hidden">
  <header>
    <b id="gridTitle">All images</b>
    <div class="seg"><button id="gCur" class="on">This series</button><button id="gAll">All series</button></div>
    <button id="gClose">Close</button>
  </header>
  <div id="gridBody"></div>
</div>

<div id="failSheet" class="sheet hidden">
  <div class="inner">
    <header><b id="failTitle">Not shown</b><button id="failClose">Close</button></header>
    <div class="body" id="failList"></div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ================= configuration ================= */
const FILES = "files/"; // served from the R2 bucket by functions/files/[[path]].js
const PARALLEL = 6;
const SKIP_FOLDERS = ["jre", "lib"];
const SKIP_EXT = ["exe", "jar", "xml"];

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const nextFrame = () => new Promise(r => setTimeout(r, 0));
let toastT;
function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove("show"), 1800); }

function parseScan(input) {
  input = (input || "").trim();
  try { const u = new URL(input); input = u.searchParams.get("s") || ""; } catch (e) {}
  return /^[A-Za-z0-9_-]{1,64}$/.test(input) ? input : null;
}
function viewerLink(scan) {
  return location.origin + location.pathname + "?s=" + encodeURIComponent(scan);
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch (e) {
    const ta = el("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta);
    ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (e2) {} ta.remove(); return ok;
  }
}

/* ================= setup screen ================= */
const CAT = { mri: "MRI", ct: "CT", xray: "X-ray", docs: "Documents" };
function studyLink(e) { return e.type === "docs" ? "docs.html?s=" + encodeURIComponent(e.id) : "./?s=" + encodeURIComponent(e.id); }
async function showSetup(errText) {
  $("#setup").classList.remove("hidden");
  $("#app").classList.add("hidden");
  $("#setupErr").textContent = errText || "";
  document.title = "Medical records";
  let lib = [];
  try { const r = await fetch("api/library", { cache: "no-store" }); if (r.ok) lib = await r.json(); }
  catch (e) { $("#setupErr").textContent = "Could not load the list (" + e.message + ")."; }
  const pick = (type, clicked) => {
    const mine = lib.filter(e => e.type === type);
    if (clicked && mine.length === 1) { location.href = studyLink(mine[0]); return; } // one study: open it straight away
    location.hash = type;
    $("#cats").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.type === type));
    const items = lib.filter(e => e.type === type).sort((a, b) => String(b.date).localeCompare(String(a.date)));
    $("#catTitle").textContent = CAT[type] || "";
    const box = $("#studyList"); box.innerHTML = "";
    if (!items.length) {
      box.appendChild(el("p", "note", "Nothing here yet."));
    }
    items.forEach(e => {
      const a = el("a"); a.href = studyLink(e);
      a.appendChild(el("span", null, e.title || e.id));
      a.appendChild(el("small", null, [e.date, e.pending ? "not opened yet – first opening copies it from Google Drive" : e.count ? e.count + (e.type === "docs" ? " file(s)" : " files") : ""].filter(Boolean).join(" · ")));
      box.appendChild(a);
    });
  };
  $("#cats").querySelectorAll("button").forEach(b => {
    const n = lib.filter(e => e.type === b.dataset.type).length;
    const word = b.dataset.type === "docs" ? ["document", "documents"] : ["study", "studies"];
    b.querySelector("span").textContent = n ? n + " " + word[n === 1 ? 0 : 1] : "none yet";
    b.classList.toggle("empty", !n);
    b.onclick = () => pick(b.dataset.type, true);
  });
  pick(CAT[location.hash.slice(1)] ? location.hash.slice(1) : "mri");
}

/* ================= file store ================= */
class FetchError extends Error {
  constructor(title, detail, status) { super(title); this.title = title; this.detail = detail; this.status = status; }
}
function explainFetchError(status, body, what) {
  if (status === 404) return new FetchError("Not found", "Could not " + what + " – the file is not on the server.", status);
  if (status === 429) return new FetchError("Rate limited", "Too many requests right now. Wait a minute and reload the page.", status);
  return new FetchError("Server error" + (status ? " (" + status + ")" : ""), (body || "").slice(0, 200) || ("Could not " + what + "."), status);
}
async function storeFetch(url, what, asBuffer) {
  for (let attempt = 0; ; attempt++) {
    let res;
    try { res = await fetch(url); }
    catch (e) {
      if (attempt === 0) { await sleep(1200); continue; }
      throw new FetchError("Network error", "Could not reach the server (" + e.message + "). Check the internet connection.", 0);
    }
    if (res.ok) return asBuffer ? res.arrayBuffer() : res.json();
    const body = await res.text().catch(() => "");
    const retryable = res.status === 429 || res.status >= 500;
    if (retryable && attempt === 0) { await sleep(1500 + Math.random() * 2500); continue; }
    throw explainFetchError(res.status, body, what);
  }
}
function fileUrl(scan, path) {
  return FILES + [scan].concat(path.split("/")).map(encodeURIComponent).join("/");
}
function extOf(name) {
  const m = /\.([^.\/]+)$/.exec(name || "");
  if (!m) return "";
  const e = m[1].toLowerCase();
  return /^\d+$/.test(e) ? "" : e; // "1.2.840.113..." style names have no real extension
}
function isDicomCandidate(f) {
  const name = (f.name || "");
  const ext = extOf(name);
  if (name.toUpperCase() === "DICOMDIR") return false;
  if (SKIP_EXT.includes(ext)) return false;
  if (f.mimeType === "application/dicom" || f.mimeType === "application/x-dicom") return true;
  if (ext === "dcm" || ext === "dicom" || ext === "ima") return true;
  if (!ext && (f.mimeType === "application/octet-stream" || !f.mimeType)) return true;
  return false;
}

/* ================= state ================= */
const S = {
  scan: null,
  series: [], seriesByUid: new Map(),
  cur: null, idx: 0, userNav: false,
  tool: "scroll", invert: false, dual: false, playing: false, playT: null,
  view: { zoom: 1, px: 0, py: 0 },
  failed: [], total: 0, done: 0, listing: true, images: 0,
  gridAll: false,
  meta: { date: "" },
};

/* ================= DICOM decoding ================= */
function fmtDate(d) {
  if (!d) return "";
  if (d instanceof Date && !isNaN(d)) return d.toISOString().slice(0, 10);
  const s = String(d).replace(/\D/g, "");
  return s.length === 8 ? s.slice(0, 4) + "-" + s.slice(4, 6) + "-" + s.slice(6, 8) : String(d);
}
function fmtTime(t) {
  if (!t) return "";
  if (t instanceof Date && !isNaN(t)) return [t.getHours(), t.getMinutes(), t.getSeconds()].map(n => String(n).padStart(2, "0")).join(":");
  const s = String(t).replace(/[^\d.]/g, "").split(".")[0];
  return s.length >= 4 ? s.slice(0, 2) + ":" + s.slice(2, 4) + (s.length >= 6 ? ":" + s.slice(4, 6) : "") : "";
}
function tagText(image, g, e) {
  try { const v = daikon.Image.getSingleValueSafely(image.getTag(g, e), 0); return v == null ? "" : v; } catch (err) { return ""; }
}
function num(v, d) { const n = Array.isArray(v) ? parseFloat(v[0]) : parseFloat(v); return isFinite(n) ? n : d; }

// Pull encapsulated JPEG frames straight out of the file (used when daikon can't decode baseline JPEG).
function extractJpegFrames(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let p = -1;
  for (let i = u8.length - 12; i >= 132; i--) { // last (7FE0,0010) tag with undefined length
    if (u8[i] === 0xE0 && u8[i + 1] === 0x7F && u8[i + 2] === 0x10 && u8[i + 3] === 0x00 &&

  if (ptrs.size === 2) {
    stopPlay();
    const [a, b] = [...ptrs.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, zoom: S.view.zoom, px: S.view.px, py: S.view.py };
    drag = null; return;
  }
  if (ptrs.size > 2) return;
  let tool = S.tool;
  if (e.button === 2) tool = "contrast"; else if (e.button === 1) tool = "move";
  const wl = curWL(), im = curImage();
  drag = { tool, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, idx: S.idx, acc: 0, wl: { c: wl.c, w: wl.w },
    range: Math.max(1, im.max - im.min), zoom: S.view.zoom, px: S.view.px, py: S.view.py, moved: false, t: performance.now() };
  if (tool === "scroll") stopPlay();
});
stage.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y) || 1, mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    zoomAt(pinch.zoom * d / pinch.d, pinch.mx, pinch.my, pinch);
    S.view.px += mx - pinch.mx; S.view.py += my - pinch.my;
    draw(); return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
  switch (drag.tool) {
    case "scroll": {
      const n = S.cur.images.length;
      const stepPx = clamp(stage.clientHeight / Math.max(n, 1), 4, 18);
      go(drag.idx + Math.round(dy / stepPx));
      break;
    }
    case "contrast": {
      const k = drag.range / 400;
      S.cur.wl = { w: Math.max(1, drag.wl.w + dx * k), c: drag.wl.c - dy * k };
      draw(); break;
    }
    case "move": S.view.px = drag.px + dx; S.view.py = drag.py + dy; draw(); break;
    case "zoom": zoomAt(drag.zoom * Math.exp(-dy * 0.01), drag.x0, drag.y0, drag); draw(); break;
  }
});
function endPtr(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (drag && drag.tool === "contrast" && S.cur && S.cur.wl) { S.cur.thumbDirty = true; renderSeriesList(); }
  if (drag && !drag.moved && e.type === "pointerup" && performance.now() - drag.t < 300) {
    const now = performance.now();
    if (now - lastTap.t < 320 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 30) { resetView(); lastTap.t = 0; }
    else lastTap = { t: now, x: e.clientX, y: e.clientY };
  }
  if (ptrs.size === 0) drag = null;
  else if (ptrs.size === 1 && !drag) { // continue as one-finger after pinch without jumping
    const [p] = [...ptrs.values()];
    drag = { tool: "move", x0: p.x, y0: p.y, px: S.view.px, py: S.view.py, moved: true, t: 0 };
  }
}
stage.addEventListener("pointerup", endPtr);
stage.addEventListener("pointercancel", endPtr);
function zoomAt(z, cx, cy, from) {
  z = clamp(z, 0.25, 20);
  const r = stage.getBoundingClientRect();
  const pw = S.dual ? r.width / 2 : r.width, px0 = S.dual && cx - r.left > pw ? pw : 0;
  const ox = cx - r.left - px0 - pw / 2, oy = cy - r.top - r.height / 2; // point relative to its panel's centre
  // keep the image point under (cx,cy) fixed
  const f = z / from.zoom;
  S.view.zoom = z;
  S.view.px = ox - (ox - from.px) * f;
  S.view.py = oy - (oy - from.py) * f;
}
let wheelAcc = 0;
stage.addEventListener("wheel", e => {
  e.preventDefault();
  if (!curImage()) return;
  S.userNav = true;
  if (e.ctrlKey) { // trackpad pinch
    zoomAt(S.view.zoom * Math.exp(-e.deltaY * 0.01), e.clientX, e.clientY, { zoom: S.view.zoom, px: S.view.px, py: S.view.py });
    draw(); return;
  }
  stopPlay();
  const d = e.deltaMode === 1 ? e.deltaY * 30 : e.deltaY;
  wheelAcc += d;
  const unit = Math.abs(d) >= 50 ? 50 : 25;
  while (Math.abs(wheelAcc) >= unit) { step(Math.sign(wheelAcc)); wheelAcc -= Math.sign(wheelAcc) * unit; }
}, { passive: false });
new ResizeObserver(() => draw()).observe(stage);

/* ================= keyboard ================= */
document.addEventListener("keydown", e => {
  if ($("#app").classList.contains("hidden") || e.target.tagName === "INPUT" && e.target.type !== "range") return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const gridOpen = !$("#grid").classList.contains("hidden");
  const k = e.key;
  S.userNav = true;
  let handled = true;
  if (k === "ArrowUp" || k === "ArrowLeft") { stopPlay(); step(-1); }
  else if (k === "ArrowDown" || k === "ArrowRight") { stopPlay(); step(1); }
  else if (k === "PageUp") seriesStep(-1);
  else if (k === "PageDown") seriesStep(1);
  else if (k === "Home") { stopPlay(); go(0); }
  else if (k === "End") { stopPlay(); go(1e9); }
  else if (k === " ") togglePlay();
  else if (k === "i" || k === "I") toggleInvert();
  else if (k === "r" || k === "R") resetView();
  else if (k === "g" || k === "G") gridOpen ? closeGrid() : openGrid();
  else if (k === "2") toggleDual();
  else if (k === "Escape") { closeGrid(); $("#failSheet").classList.add("hidden"); }
  else handled = false;
  if (handled) { e.preventDefault(); if (gridOpen && k.startsWith("Arrow")) buildGrid(); }
});

/* ================= all-images grid ================= */
let gridObs = null;
function openGrid() { if (!S.cur) return; stopPlay(); $("#grid").classList.remove("hidden"); buildGrid(true); }
function closeGrid() { $("#grid").classList.add("hidden"); $("#gridBody").innerHTML = ""; if (gridObs) gridObs.disconnect(); }
$("#gClose").onclick = closeGrid;
$("#gCur").onclick = () => { S.gridAll = false; buildGrid(true); };
$("#gAll").onclick = () => { S.gridAll = true; buildGrid(true); };
let gridSig = "";
function buildGrid(force) {
  $("#gCur").classList.toggle("on", !S.gridAll); $("#gAll").classList.toggle("on", S.gridAll);
  const list = S.gridAll ? S.series : [S.cur];
  const sig = (S.gridAll ? "A" : S.cur.uid) + ":" + list.map(s => s.images.length).join(",");
  const body = $("#gridBody");
  if (!force && sig === gridSig) { // only move the highlight
    body.querySelectorAll(".gi.on").forEach(x => x.classList.remove("on"));
    const cur = body.querySelector('.gi[data-s="' + S.series.indexOf(S.cur) + '"][data-i="' + S.idx + '"]');
    if (cur) { cur.classList.add("on"); cur.scrollIntoView({ block: "nearest" }); }
    return;
  }
  gridSig = sig;
  const scrollTop = force ? null : body.scrollTop;
  if (gridObs) gridObs.disconnect();
  gridObs = new IntersectionObserver(entries => entries.forEach(en => {
    if (!en.isIntersecting || en.target._drawn) return;
    en.target._drawn = true;
    const s = S.series[+en.target.dataset.s], im = s.images[+en.target.dataset.i];
    drawThumb(en.target.firstChild, im, s);
  }), { root: body, rootMargin: "300px" });
  body.innerHTML = "";
  $("#gridTitle").textContent = S.gridAll ? "All series (" + S.images + " images)" : S.cur.desc + " (" + S.cur.images.length + ")";
  let active = null;
  for (const s of list) {
    sortSeries(s);
    const si = S.series.indexOf(s);
    if (S.gridAll) body.appendChild(el("div", "gh", seriesTitle(s) + " (" + s.images.length + ")"));
    const g = el("div", "gg");
    s.images.forEach((im, i) => {
      const b = el("button", "gi");
      b.dataset.s = si; b.dataset.i = i;
      const c = el("canvas"); c.width = 160; c.height = 160;
      b.append(c, el("span", null, String(i + 1)));
      if (s === S.cur && i === S.idx) { b.classList.add("on"); active = b; }
      b.onclick = () => { S.userNav = true; if (s !== S.cur) selectSeries(s); go(i); closeGrid(); };
      g.appendChild(b); gridObs.observe(b);
    });
    body.appendChild(g);
  }
  if (scrollTop != null) body.scrollTop = scrollTop;
  else if (active) active.scrollIntoView({ block: "center" });
}

/* ================= failures ================= */
function addFailure(name, reason) { S.failed.push({ name, reason }); updateStatus(); }
$("#failBtn").onclick = () => {
  const box = $("#failList"); box.innerHTML = "";
  S.failed.forEach(f => { const d = el("div", null, f.name + " "); d.appendChild(el("span", null, "— " + f.reason)); box.appendChild(d); });
  $("#failTitle").textContent = S.failed.length + " not shown";
  $("#failSheet").classList.remove("hidden");
};
$("#failClose").onclick = () => $("#failSheet").classList.add("hidden");
$("#failSheet").onclick = e => { if (e.target.id === "failSheet") $("#failSheet").classList.add("hidden"); };

/* ================= status / messages ================= */
function updateStatus() {
  let t;
  const ns = S.series.length;
  if (S.listing) t = "Finding files… " + S.total + " found" + (S.images ? " · " + S.images + " images shown" : "");
  else if (S.done < S.total) t = "Loading " + S.done + " / " + S.total + " files · " + S.images + " images, " + ns + " series";
  else t = S.images + " images · " + ns + " series";
  $("#status").textContent = t;
  const pct = S.total ? (S.done / S.total) * 100 : 0;
  $("#bar").style.display = (!S.listing && S.done >= S.total) ? "none" : "";
  $("#bar>i").style.width = (S.listing ? Math.min(pct, 10) : pct) + "%";
  const busy = S.listing || S.done < S.total;
  $("#loadBox").classList.toggle("done", !busy);
  if (busy) {
    $("#loadTxt").textContent = S.listing ? "Loading scan…" : "Loading images: " + S.done + " of " + S.total + " (" + Math.round(pct) + "%)";
    $("#loadBar>i").style.width = (S.listing ? 5 : pct) + "%";
  }
  const fb = $("#failBtn");
  fb.classList.toggle("hidden", !S.failed.length);
  fb.textContent = S.failed.length + " not shown";
  if (S.images && !$("#msg").classList.contains("error")) hideMsg();
}
function showMsg(title, text, opts) {
  opts = opts || {};
  const m = $("#msg");
  m.className = opts.error ? "error" : "";
  m.innerHTML = "";
  const box = el("div", "box");
  if (opts.spin) box.appendChild(el("div", "spin"));
  box.appendChild(el("h2", null, title));
  if (text) box.appendChild(el("p", null, text));
  if (opts.retry) { const b = el("button", "on", "Try again"); b.onclick = () => location.reload(); box.appendChild(b); }
  if (opts.setup) { const b = el("button", null, "Use another scan"); b.style.marginLeft = "8px"; b.onclick = () => { location.href = location.pathname; }; box.appendChild(b); }
  m.appendChild(box);
  m.style.display = "";
}
function hideMsg() { const m = $("#msg"); m.style.display = "none"; m.className = ""; }

/* ================= loading pipeline ================= */
function listScan(j, scan, onFile) {
  // files.json: ["DICOM/…/IM0", …] or { "files": [...] }, paths relative to <scan>/
  const paths = Array.isArray(j) ? j : (j && j.files) || [];
  for (let p of paths) {
    p = String(typeof p === "object" && p ? p.path : p).replace(/^\/+/, "");
    if (p.startsWith(scan + "/")) p = p.slice(scan.length + 1);
    const parts = p.split("/");
    if (parts.slice(0, -1).some(d => SKIP_FOLDERS.includes(d.trim().toLowerCase()))) continue;
    const f = { name: parts[parts.length - 1], path: p };
    if (isDicomCandidate(f)) onFile(f);
  }
}

function q404() { return new URLSearchParams(location.search).has("noimport"); }
async function start(scan) {
  S.scan = scan;
  $("#setup").classList.add("hidden");
  $("#app").classList.remove("hidden");
  if (typeof daikon === "undefined" || !daikon.Series) { showMsg("Could not load the DICOM decoder", "The decoder script from cdn.jsdelivr.net did not load. Check the connection or content blockers and try again.", { error: true, retry: true }); return; }
  showMsg("Opening scan…", "", { spin: true });
  updateStatus();

  // 1) fetch the file list (gives a clear error when the scan does not exist)
  let list;
  try {
    list = await storeFetch(fileUrl(scan, "files.json"), "open the scan", false);
  } catch (e) {
    S.listing = false; $("#status").textContent = e.title || "Error";
    if (e.status === 404 && !q404()) { location.replace("import.html?s=" + encodeURIComponent(scan)); return; } // first visit: copy the scan into storage
    if (e.status === 404) showMsg("Scan not found", "There is no scan called \"" + scan + "\" on this site.", { error: true, setup: true });
    else showMsg(e.title || "Error", e.detail || e.message, { error: true, retry: true });
    return;
  }
  document.title = scan + " – MRI Viewer";

  // 2) download + decode
  const queue = [], retryLater = [];
  let listingDone = false, wake = null;
  const notify = () => { if (wake) { const w = wake; wake = null; w(); } };
  const onFile = f => { queue.push(f); S.total++; updateStatus(); notify(); };
  let decodeChain = Promise.resolve();
  async function worker() {
    for (;;) {
      if (!queue.length) {
        if (listingDone) return;
        await new Promise(r => { const prev = wake; wake = () => { r(); prev && prev(); }; });
        continue;
      }
      const f = queue.shift();
      let buf;
      try {
        buf = await storeFetch(fileUrl(scan, f.path), "download " + f.name, true);
      } catch (e) {
        if (!f.retried) { f.retried = true; retryLater.push(f); continue; } // second, slower pass later
        addFailure(f.path, "download failed: " + (e.title || e.message) + (e.status ? " (HTTP " + e.status + ")" : ""));
        S.done++; updateStatus();
        continue;
      }
      // decode one file at a time on the main thread, yielding between files
      decodeChain = decodeChain.then(async () => {
        try { const ims = await decodeFile(buf, f.name); addImages(ims); }
        catch (e) { addFailure(f.path, e.message || String(e)); }
        buf = null; S.done++;
        scheduleUI();
        await nextFrame();
      });
      await decodeChain;
    }
  }
  const workers = Array.from({ length: PARALLEL }, worker);
  listScan(list, scan, onFile);
  listingDone = true; S.listing = false; notify(); updateStatus();
  await Promise.all(workers);
  if (retryLater.length) { // retry failed downloads slowly, 2 at a time
    await sleep(4000);
    queue.push(...retryLater.splice(0));
    await Promise.all([worker(), worker()]);
  }
  await decodeChain;
  refreshUI();
  if (!S.images) {
    if (!S.total) showMsg("No DICOM files found", "The scan's file list contains no DICOM image files.", { error: true, setup: true });
    else showMsg("No images could be shown", "None of the " + S.total + " files could be displayed. Tap \"" + S.failed.length + " not shown\" at the top for details.", { error: true, retry: true });
  }
  // refresh series thumbnails with the middle image now that everything has arrived
  S.series.forEach(s => s.thumbDirty = true); renderSeriesList();
}

/* ================= boot ================= */
(function boot() {
  const q = new URLSearchParams(location.search);
  const sc = q.get("s");
  if (!sc) { showSetup(); return; }
  if (!parseScan(sc)) { showSetup("The link contains an invalid scan name."); return; }
  start(sc);
})();
</script>
</body>
