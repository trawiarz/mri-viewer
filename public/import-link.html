<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<title>Import from OneDrive</title>
<style>
  :root{--panel:#1b1d22;--line:#2c2f36;--muted:#9aa0aa;--accent:#4a90e2;--bad:#ff8a80}
  body{margin:0;background:#111;color:#ddd;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center;padding:16px}
  .card{width:100%;max-width:640px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;box-sizing:border-box}
  h1{font-size:20px;margin:0 0 12px}
  input,select{width:100%;box-sizing:border-box;background:#0b0c0e;color:inherit;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit}
  button{background:#23262d;color:inherit;border:1px solid var(--line);border-radius:8px;padding:10px 14px;font:inherit;cursor:pointer}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  button:disabled{opacity:.5;cursor:default}
  .grp{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px;background:#0b0c0e}
  .grp .row{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;margin-top:8px}
  .grp label{font-size:13px;color:var(--muted)}
  .note,#status{font-size:13px;color:var(--muted);margin-top:8px}
  #bar{height:8px;background:#2c2f36;border-radius:4px;overflow:hidden;margin:14px 0 6px}
  #bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  #err{color:var(--bad);white-space:pre-wrap;font-size:13px;max-height:30vh;overflow:auto}
  a{color:var(--accent)}
</style>
</head>
<body>
<div class="card">
  <h1>Import from a OneDrive link</h1>
  <input id="link" placeholder="Paste the OneDrive folder link (Share → Copy link)">
  <div style="margin-top:10px"><button id="scan" class="on">Scan folder</button></div>
  <div id="status"></div>
  <div id="groups"></div>
  <div id="goWrap" hidden style="margin-top:14px"><button id="go" class="on">Import selected</button></div>
  <div id="bar" hidden><i></i></div>
  <div id="err"></div>
  <p class="note">The folder must be shared as "Anyone with the link can view". Files are copied from OneDrive into this site's private storage.<br><a href="./">&#8592; Back to records</a> · <a href="upload.html">Upload from this device instead</a></p>
</div>
<script>
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const SKIP_FOLDERS = ["jre", "lib"];
const SKIP_EXT = ["exe", "jar", "xml", "dll", "ini", "inf", "bat", "cmd", "sh", "properties", "ico", "gif", "htm", "html", "css", "js", "txt", "pdf", "jpg", "jpeg", "png", "doc", "docx", "zip", "lnk", "url"];
const DOC_EXT = ["pdf", "jpg", "jpeg", "png", "webp"];
const TYPE_OF = { CT: "ct", MR: "mri", CR: "xray", DX: "xray", DR: "xray", RG: "xray", XA: "xray", RF: "xray", MG: "xray", PX: "xray", IO: "xray" };
function ext(n) { const m = /\.([^.\/]+)$/.exec(n || ""); if (!m) return ""; const e = m[1].toLowerCase(); return /^\d+$/.test(e) ? "" : e; }
const isDicom = f => { const e = ext(f.name); return f.name.toUpperCase() !== "DICOMDIR" && !f.name.startsWith(".") && (["dcm", "dicom", "ima"].includes(e) || (!e && !SKIP_EXT.includes(e))); };
const isDoc = f => DOC_EXT.includes(ext(f.name));
async function api(op, body) {
  for (let a = 0; ; a++) {
    try {
      const r = await fetch("api/remote?op=" + op, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const j = await r.json().catch(() => ({ error: "HTTP " + r.status }));
      if (r.ok) return j;
      if (a >= 2 || r.status === 400) throw new Error(j.error || "HTTP " + r.status);
    } catch (e) { if (a >= 2) throw e; }
    await new Promise(r => setTimeout(r, 1500 * 2 ** a));
  }
}
let groups = [];
$("#scan").onclick = async () => {
  const link = $("#link").value.trim(); if (!link) return;
  $("#scan").disabled = true; $("#err").textContent = ""; $("#groups").innerHTML = ""; $("#goWrap").hidden = true;
  try {
    // walk the shared folder: every file keeps its path; group by top-level subfolder
    const files = [], root = await api("list", { link });
    const queue = [{ items: root.items, path: [] }];
    let folders = 0;
    while (queue.length) {
      const { items, path } = queue.shift();
      for (const it of items) {
        if (it.folder) {
          if (SKIP_FOLDERS.includes(it.name.trim().toLowerCase())) continue;
          folders++; $("#status").textContent = "Reading folders… " + folders + " · " + files.length + " files";
          const sub = await api("list", { link, itemId: it.id, driveId: it.driveId });
          queue.push({ items: sub.items, path: path.concat(it.name) });
        } else files.push(Object.assign({}, it, { path: path.concat(it.name) }));
      }
    }
    const byKey = new Map();
    for (const f of files) {
      const kind = isDicom(f) ? "scan" : isDoc(f) ? "docs" : null; if (!kind) continue;
      const top = f.path.length > 1 ? f.path[0] : "(main folder)";
      const key = kind + "|" + top;
      if (!byKey.has(key)) byKey.set(key, { kind, top, files: [] });
      byKey.get(key).files.push(f);
    }
    groups = [...byKey.values()];
    if (!groups.length) throw new Error("No scan images or documents found in this folder (" + files.length + " files looked at).");
    $("#status").textContent = "Found " + groups.length + " group(s). Detecting scan types…";
    for (const g of groups) {
      g.type = "docs"; g.title = g.top; g.date = "";
      if (g.kind === "scan") {
        try {
          const info = await api("peek", { url: g.files[0].url });
          g.type = TYPE_OF[(info.modality || "").toUpperCase()] || "ct";
          g.title = info.desc || info.series || g.top;
          if (/^\d{8}$/.test(info.date || "")) g.date = info.date.slice(0, 4) + "-" + info.date.slice(4, 6) + "-" + info.date.slice(6, 8);
          g.modality = info.modality || "?";
        } catch (e) { g.type = "ct"; g.modality = "unknown (" + e.message + ")"; }
      }
      const box = el("div", "grp");
      const head = el("label"); const cb = el("input"); cb.type = "checkbox"; cb.checked = true; cb.style.width = "auto"; head.append(cb, " ", g.top + " — " + g.files.length + " " + (g.kind === "scan" ? "image files" : "documents") + (g.modality ? " · modality " + g.modality : ""));
      const row = el("div", "row");
      const sel = el("select"); [["mri", "MRI"], ["ct", "CT"], ["xray", "X-ray"], ["docs", "Documents"]].forEach(([v, t]) => { const o = el("option", null, t); o.value = v; sel.appendChild(o); }); sel.value = g.type;
      const ti = el("input"); ti.value = g.title; const da = el("input"); da.type = "date"; da.value = g.date;
      row.append(el("label", null, "Type"), sel, el("label", null, "Title"), ti, el("label", null, "Date"), da);
      box.append(head, row); $("#groups").appendChild(box);
      g.ui = { cb, sel, ti, da };
    }
    $("#status").textContent = "Check the type, title and date of each group, then press Import.";
    $("#goWrap").hidden = false;
  } catch (e) { $("#err").textContent = "Could not read the folder: " + e.message; $("#status").textContent = ""; }
  $("#scan").disabled = false;
};
$("#go").onclick = async () => {
  const chosen = groups.filter(g => g.ui.cb.checked); if (!chosen.length) return;
  $("#go").disabled = true; $("#bar").hidden = false; $("#err").textContent = "";
  const total = chosen.reduce((a, g) => a + g.files.length, 0); let done = 0; const errors = [];
  const show = () => { $("#status").textContent = "Copying " + done + " / " + total; $("#bar i").style.width = (done / total * 100) + "%"; };
  const links = [];
  for (const g of chosen) {
    const type = g.ui.sel.value, date = g.ui.da.value;
    g.id = g.id || type + "-" + (date || "").replace(/-/g, "") + "-" + Math.random().toString(36).slice(2, 7);
    const rel = f => (f.path.length > 1 ? f.path.slice(1) : f.path).map(x => x.replace(/[^\w.\- ]+/g, "_").trim() || "_").join("/");
    const jobs = g.files.map(f => ({ f, path: rel(f) })); let next = 0; const before = errors.length;
    const worker = async () => { while (next < jobs.length) { const j = jobs[next++]; try { await api("copy", { url: j.f.url, s: g.id, path: j.path, size: j.f.size }); } catch (e) { errors.push(g.top + "/" + j.path + ": " + e.message); } done++; show(); } };
    show(); await Promise.all([worker(), worker(), worker(), worker()]);
    if (errors.length > before) continue;
    const r = await fetch("api/upload?s=" + g.id + "&finish=1", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type, title: g.ui.ti.value.trim() || g.top, date, files: jobs.map(j => j.path) }) });
    if (!r.ok) { errors.push(g.top + ": could not finish (" + await r.text() + ")"); continue; }
    links.push("<a href='" + (type === "docs" ? "docs.html?s=" : "./?s=") + g.id + "'>" + (g.ui.ti.value.trim() || g.top) + "</a>");
  }
  $("#status").innerHTML = (links.length ? "Imported: " + links.join(" · ") + ". " : "") + "<a href='./'>Back to records</a>";
  if (errors.length) { $("#err").textContent = errors.length + " problem(s) – press Scan folder, then Import again to retry:\n" + errors.slice(0, 50).join("\n"); }
  $("#go").disabled = false;
};
</script>
</body>
</html>
